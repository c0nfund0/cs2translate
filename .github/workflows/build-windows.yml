name: build-windows-exe

# Builds the distributable on a real Windows runner. PyInstaller cannot
# cross-compile and the payload here is native (CTranslate2, onnxruntime,
# PortAudio, cuDNN), so this is the only place the exe can be produced.
on:
  # Tag-only. Pushing to a branch never builds. A full build downloads ~1.5GB
  # of CUDA libraries, takes ~9 minutes, and bills at 2x on Windows runners, so
  # it runs when a version is actually being cut -- not on every commit.
  push:
    tags: ["v*"]

  # Manual escape hatch: build the exe without cutting a tag. Produces a
  # 30-day artifact, does NOT publish a release.
  workflow_dispatch:
    inputs:
      with_cuda:
        description: "Bundle cuBLAS + cuDNN (GPU works on machines with only a driver)"
        type: boolean
        default: true

# A re-run of the same tag supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # This repo's default workflow token is read-only, so creating a release on
    # a tag would 403 without this. Scoped to the job rather than raised
    # repo-wide, so only tag builds can write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          # Cover the CUDA wheels too; they are ~1.2GB and dominate build time
          # when they have to be re-downloaded.
          cache-dependency-path: |
            requirements.txt
            requirements-cuda.txt

      # Only a manual run can turn CUDA off. Note this cannot be written as
      # `inputs.with_cuda == false`: on a push event `inputs.with_cuda` is null,
      # and GitHub's loose equality coerces null and false to the same value, so
      # that form would silently disable CUDA on every push.
      - name: Resolve build flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.with_cuda }}" = "false" ]; then
            echo "cuda=0" >> "$GITHUB_OUTPUT"
          else
            echo "cuda=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Install CUDA runtime libraries
        if: steps.flags.outputs.cuda == '1'
        run: pip install -r requirements-cuda.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build
        env:
          CS2T_CUDA: ${{ steps.flags.outputs.cuda }}
        run: pyinstaller --noconfirm --clean cs2translate.spec

      # Catches the failure mode this project is most exposed to: a native
      # dependency that PyInstaller's scanner missed, which only shows up when
      # the frozen binary actually imports it.
      - name: Smoke test the frozen exe
        run: |
          dist\cs2translate\cs2translate.exe --help
          if ($LASTEXITCODE -ne 0) { throw "frozen exe failed to start" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item config.example.toml dist\cs2translate\ -Force
          Compress-Archive -Path dist\cs2translate\* -DestinationPath cs2translate-windows-x64.zip
          "$([math]::Round((Get-Item cs2translate-windows-x64.zip).Length/1MB,1)) MB" | Tee-Object -Variable sz
          "### Build OK — ``$sz`` zipped" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: cs2translate-windows-x64
          path: cs2translate-windows-x64.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: cs2translate-windows-x64.zip
          generate_release_notes: true
          name: cs2translate ${{ github.ref_name }}
          body: |
            Real-time local CS2 voice translation with spoken English output.

            **Download `cs2translate-windows-x64.zip`**, unzip anywhere on the
            Windows machine, and run `cs2translate.exe`. Python is not needed on
            the target machine.

            The download is large because cuBLAS and cuDNN are bundled — that is
            what lets fp16 inference work on a machine with only an NVIDIA
            driver and no CUDA toolkit installed.

            Models are **not** bundled (whisper large-v3 alone is ~3GB); they
            download to `%USERPROFILE%\.cache\cs2translate` on first run.

            First steps:
            ```
            cs2translate.exe --list-devices    :: confirm the right loopback device
            cs2translate.exe                   :: run it
            cs2translate.exe --log-level DEBUG :: per-utterance timings
            ```
            Set CS2 to borderless windowed; exclusive fullscreen can break
            loopback capture.
