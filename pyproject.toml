[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2translate"
version = "0.1.0"
description = "Listen to CS2 voice comms, detect the language, and speak English locally in real time."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.0.3",
    "onnxruntime>=1.17",
    "soxr>=0.3.7",
    "piper-tts>=1.2.0",
    "nvidia-ml-py>=12.535",
    "scipy>=1.10",
    "tomli>=2.0 ; python_version < '3.11'",
    "PyAudioWPatch>=0.2.12.7 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
duck = ["pycaw>=20240210 ; sys_platform == 'win32'"]
dev = ["pytest>=7"]

[project.scripts]
cs2translate = "cs2translate.__main__:main"

[tool.setuptools.packages.find]
include = ["cs2translate*"]
